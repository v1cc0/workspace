[package]
name = "workspace-server"
version = "0.1.0"
edition = "2024"

[workspace]

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync"] }
turso = { version = "0.8.3", default-features = false }

[dev-dependencies]
tempfile = "3.27.0"
